<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>フラクタル散歩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-screen canvas, HUD pinned to the four corners, thumbs at the bottom */
  --ink:#f3efe6;
  --ink-dim:#b9b4c6;
  --panel:rgba(18,14,34,.62);
  --line:rgba(243,239,230,.28);
  --accent:#ffb454;
  --bg:#0b0916;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
.hud{position:fixed;display:flex;gap:8px;z-index:2}
.top-left{top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));flex-direction:column;align-items:flex-start}
.top-right{top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));flex-direction:column;align-items:flex-end}
.bottom-right{bottom:calc(18px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right));flex-direction:column;align-items:flex-end;gap:10px}
.row{display:flex;gap:6px}
.top-left .row{flex-wrap:wrap;max-width:calc(100vw - 150px)}
.top-left .stat{max-width:calc(100vw - 150px)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:13px;font-weight:700;line-height:1;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:#1b1205;border-color:var(--accent)}
button.big{width:68px;height:68px;border-radius:50%;font-size:13px;padding:0}
button.mid{min-width:52px;height:44px}
.stat{font-size:12px;color:var(--ink-dim);background:var(--panel);border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(18,14,34,.3);
  left:calc(26px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));z-index:1;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(243,239,230,.55)}
#hint{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;line-height:1.6;
  max-width:min(88vw,460px);text-align:left;pointer-events:none;transition:opacity .6s}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;
  background:var(--accent);color:#1b1205;font-weight:700;font-size:13px;border-radius:8px;padding:7px 12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#lockhint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;font-size:11.5px;color:var(--ink-dim);background:var(--panel);border-radius:8px;padding:4px 10px;opacity:0;pointer-events:none;transition:opacity .3s}
#panel{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:5;width:min(330px,calc(100vw - 24px));
  max-height:calc(100% - 24px);overflow:auto;background:rgba(18,14,34,.9);border:1px solid var(--line);border-radius:12px;padding:14px;
  display:flex;flex-direction:column;gap:6px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);user-select:none}
#panel[hidden]{display:none}
#panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#panel label{display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
#panel label span{color:var(--accent);font-variant-numeric:tabular-nums}
#panel label.opt{justify-content:flex-start;align-items:center;gap:8px;color:var(--ink-dim)}
#panel input[type=range]{width:100%;accent-color:var(--accent);margin:0 0 6px;touch-action:auto}
#panel fieldset{border:1px solid var(--line);border-radius:8px;padding:6px 10px 8px;margin:2px 0 6px;display:flex;flex-direction:column;gap:4px}
#panel legend{padding:0 4px;color:var(--ink)}
#panel input[type=radio],#panel input[type=checkbox]{accent-color:var(--accent)}
#panel .pnote{margin:4px 0 0;font-size:11.5px;color:var(--ink-dim);line-height:1.5}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:9;background:var(--bg)}
@media (hover:hover) and (pointer:fine){#stick{display:none}}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud top-left">
  <div class="row" role="group" aria-label="ワールド">
    <button id="w0" aria-pressed="true">回廊</button>
    <button id="w1" aria-pressed="false">箱</button>
    <button id="w2" aria-pressed="false">聖堂</button>
    <button id="w3" aria-pressed="false">機巧</button>
    <button id="w4" aria-pressed="false">虹</button>
    <button id="w5" aria-pressed="false">結晶</button>
    <button id="w6" aria-pressed="false">骨</button>
    <button id="w7" aria-pressed="false">万華鏡</button>
    <button id="w8" aria-pressed="false">三角</button>
    <button id="w9" aria-pressed="false">貝殻</button>
    <button id="w10" aria-pressed="false">花</button>
    <button id="w11" aria-pressed="false">岩</button>
  </div>
  <div class="stat" id="wname">メンガー回廊</div>
</div>

<div class="hud top-right">
  <div class="stat">体の大きさ <b id="sz">×1</b></div>
  <div class="row">
    <button class="mid" id="smaller" aria-label="小さくなる">縮む</button>
    <button class="mid" id="bigger" aria-label="大きくなる">育つ</button>
  </div>
  <button class="mid" id="opt" aria-expanded="false" aria-controls="panel">設定</button>
</div>

<div class="hud bottom-right">
  <button class="mid" id="auto" aria-pressed="true">自動サイズ</button>
  <button class="mid" id="fly" aria-pressed="false">飛行</button>
  <button class="big" id="jump">ジャンプ</button>
</div>

<div id="stick"><div id="knob"></div></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="panel" role="dialog" aria-label="設定" hidden>
  <div class="ph"><b>設定</b><button id="optclose" aria-label="設定を閉じる">閉じる</button></div>
  <label for="sGrav">重力の強さ <span id="vGrav"></span></label>
  <input type="range" id="sGrav" min="0.1" max="3" step="0.1">
  <label for="sJump">ジャンプの高さ <span id="vJump"></span></label>
  <input type="range" id="sJump" min="0.3" max="4" step="0.1">
  <label for="sFall">落ち続けたら飛行に切り替える <span id="vFall"></span></label>
  <input type="range" id="sFall" min="0" max="10" step="0.5">
  <fieldset>
    <legend>視点の上下の限度（酔い軽減）</legend>
    <label class="opt"><input type="radio" name="sLook" value="walk" id="sLook1"> 重力があるときだけ（標準）</label>
    <label class="opt"><input type="radio" name="sLook" value="always" id="sLook2"> 飛行中も常に（酔いにくい）</label>
    <label class="opt"><input type="radio" name="sLook" value="never" id="sLook3"> 限度なし（完全に自由）</label>
  </fieldset>
  <label for="sSens">視点の感度 <span id="vSens"></span></label>
  <input type="range" id="sSens" min="0.3" max="3" step="0.1">
  <label class="opt"><input type="checkbox" id="sEdge"> 画面の端にカーソルを置くと回り続ける</label>
  <button id="sReset">初期設定に戻す</button>
  <p class="pnote">O キーでも開閉できます。設定はこのブラウザに保存されます。</p>
</div>
<div id="lockhint">カーソル固定中 ・ Escで解除</div>
<div id="err">この端末ではWebGLが使えないため、表示できません。別のブラウザで開いてみてください。</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform vec3 uPos;
uniform mat3 uRot;
uniform int uWorld;
uniform float uScale;
uniform float uFar;
uniform int uIter;
uniform vec3 uP;
uniform mat3 uG;
uniform vec3 uC;
uniform mat3 uG0;
uniform float uInvS;
uniform int uTile;
uniform int uKind;
uniform int uRule;
uniform float uBS;
uniform float uTileP;
uniform float uDr0;
uniform float uCr;
uniform vec3 uR[14];
uniform vec3 uH[14];
uniform vec3 uL[14];
uniform vec3 uSg[14];
uniform float uMs[14];
uniform vec3 uAf;
uniform float uMc;
uniform int uN;
uniform vec3 uA[8];
uniform float uS[8];
uniform float uT[8];
float trap;

float deMenger(vec3 q){
  float d=-1e5; trap=0.0;
  for(int m=0;m<8;m++){
    if(m>=uN) break;
    vec3 a=mod(uA[m]+q*uS[m],2.0)-1.0;
    float c;
    if(uRule==1){
      vec3 e=max(1.0-abs(a)-0.3333333,0.0); vec3 q2=e*e;
      c=sqrt(max(q2.x+q2.y+q2.z-max(q2.x,max(q2.y,q2.z)),0.0))/uS[m];
    }else{
      vec3 r=abs(1.0-3.0*abs(a));
      c=(min(max(r.x,r.y),min(max(r.y,r.z),max(r.z,r.x)))-1.0)/(3.0*uS[m]);
    }
    if(c>d){d=c;trap=uT[m];}
  }
  return d;
}
float deBox(vec3 q){
  vec3 z=uP+uG*q; vec3 c=uC+uG0*q;
  if(uTile==1){vec3 n=floor(z/uTileP+0.5)*uTileP; z-=n; c-=n;}
  float dr=uDr0; trap=1e9;
  for(int i=0;i<20;i++){
    if(i>=uIter) break;
    z=clamp(z,-1.0,1.0)*2.0-z;
    float r2=dot(z,z);
    trap=min(trap,r2);
    if(r2<0.25){z*=4.0;dr*=4.0;}
    else if(r2<1.0){z/=r2;dr/=r2;}
    z=z*uBS+c; dr=dr*abs(uBS)+uCr;
  }
  return length(z)/dr*uInvS;
}
float deApo(vec3 q){
  vec3 d=uG*q; float sc=1.0; trap=1e9;
  for(int i=0;i<14;i++){
    if(i>=uIter) break;
    vec3 r=uR[i];
    vec3 th=d-uH[i], tl=-d-uL[i];
    d-=2.0*(step(0.0,th)*(floor(th*0.5)+1.0)-step(0.0,tl)*(floor(tl*0.5)+1.0));
    vec3 p=r+d;
    float r2p=dot(p,p), r2r=dot(r,r), kp=APOS/r2p;
    d=d*kp-r*(APOS*(2.0*dot(r,d)+dot(d,d))/(r2p*r2r));
    sc*=kp; trap=min(trap,r2p);
  }
  return 0.25*abs(uAf.y+d.y)/sc*uInvS;
}
float dePK(vec3 q){
  vec3 d=uG*q; vec3 C=vec3(1.0,1.0,1.3); float sc=1.0; trap=1e9;
  for(int i=0;i<14;i++){
    if(i>=uIter) break;
    vec3 r=uR[i], H=uH[i], L=uL[i];
    vec3 e=uSg[i]*d;
    vec3 th=e-H, tl=-e-L;
    vec3 dn=mix(e,H-th,step(0.0,th));
    dn=mix(dn,tl-L,step(0.0,tl));
    vec3 gen=(C-abs(mod(r+e+C,4.0*C)-2.0*C))-r;
    d=mix(dn,gen,step(2.0*C,max(th,tl)));
    float rd2=2.0*dot(r,d)+dot(d,d);
    float r2r=dot(r,r), r2p=r2r+rd2;
    float mr=uMs[i], mp=mr+rd2;
    float kp=(mp<0.0)?1.2/r2p:1.0;
    float dk;
    if(mr<0.0) dk=(mp<0.0)?(-1.2*rd2/(r2p*r2r)):(mr/r2r);
    else dk=(mp<0.0)?(-mp/r2p):0.0;
    d=d*kp+r*dk;
    sc*=kp; trap=min(trap,r2p);
  }
  vec3 p=uAf+d;
  float ra=length(uAf.xy), rxy=length(p.xy);
  float dc=uMc+(2.0*dot(uAf.xy,d.xy)+dot(d.xy,d.xy))/(rxy+ra);
  return 0.6*max(dc,abs(rxy*p.z)/length(p))/sc*uInvS;
}
uniform mat3 uKR;
uniform float uKS;
uniform vec3 uKO;
float deKifs(vec3 q){
  vec3 p=uP+uG*q;
  if(uTile==1) p-=floor(p/uTileP+0.5)*uTileP;
  float sc=1.0; trap=1e9;
  for(int i=0;i<28;i++){
    if(i>=uIter) break;
    if(uRule==1){
      if(p.x+p.y<0.0) p.xy=-p.yx;
      if(p.x+p.z<0.0) p.xz=-p.zx;
      if(p.y+p.z<0.0) p.yz=-p.zy;
    }else{
      p=abs(p);
      if(uRule==0){
        if(p.x<p.y) p.xy=p.yx;
        if(p.x<p.z) p.xz=p.zx;
        if(p.y<p.z) p.yz=p.zy;
      }
    }
    p=uKR*p;
    p=p*uKS-uKO*(uKS-1.0); sc*=uKS;
    trap=min(trap,dot(p,p));
  }
  return (length(p)-1.0)/sc*uInvS;
}
float de(vec3 p){
  if(uKind==0) return deMenger(p);
  if(uKind==1) return deBox(p);
  if(uKind==2) return deApo(p);
  if(uKind==3) return dePK(p);
  return deKifs(p);
}
vec3 nrm(vec3 p,float e){
  vec2 k=vec2(1.0,-1.0);
  return normalize(k.xyy*de(p+k.xyy*e)+k.yyx*de(p+k.yyx*e)+k.yxy*de(p+k.yxy*e)+k.xxx*de(p+k.xxx*e));
}
vec3 pal(float t,vec3 a,vec3 b,vec3 c,vec3 d){return a+b*cos(6.28318*(c*t+d));}
vec3 sky(vec3 rd){
  float h=clamp(rd.y*0.5+0.5,0.0,1.0);
  if(uWorld==0) return mix(vec3(0.98,0.62,0.36),vec3(0.13,0.12,0.34),pow(h,0.55)*1.0)+vec3(0.35,0.2,0.05)*pow(1.0-abs(rd.y),8.0);
  if(uWorld==1) return mix(vec3(0.80,0.90,0.93),vec3(0.20,0.42,0.62),pow(h,0.8));
  if(uWorld==2) return mix(vec3(0.10,0.05,0.16),vec3(0.02,0.02,0.07),h);
  if(uWorld==3) return mix(vec3(0.07,0.11,0.13),vec3(0.02,0.04,0.07),h);
  if(uWorld==4) return mix(vec3(0.015,0.03,0.08),vec3(0.0,0.005,0.03),h);
  if(uWorld==5) return mix(vec3(0.42,0.62,0.74),vec3(0.03,0.08,0.22),pow(h,0.7));
  if(uWorld==6) return mix(vec3(0.20,0.12,0.08),vec3(0.03,0.02,0.03),h);
  if(uWorld==7) return mix(vec3(0.16,0.06,0.20),vec3(0.02,0.01,0.06),h);
  if(uWorld==8) return mix(vec3(0.96,0.80,0.62),vec3(0.30,0.46,0.72),pow(h,0.6));
  if(uWorld==9) return mix(vec3(0.05,0.22,0.26),vec3(0.01,0.04,0.10),h);
  if(uWorld==10) return mix(vec3(0.34,0.22,0.42),vec3(0.05,0.03,0.12),pow(h,0.7));
  return mix(vec3(0.05,0.05,0.07),vec3(0.0,0.0,0.015),h);
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-uRes)/uRes.y;
  vec3 rd=uRot*normalize(vec3(uv,-1.35));
  float px=1.2/uRes.y;
  float t=0.0, st=0.0, tr=0.0; bool hit=false;
  float k=(uKind==1)?0.85:((uKind==4)?0.9:1.0);
  for(int i=0;i<170;i++){
    float d=de(uPos+rd*t);
    if(d<px*t+max(2e-5*uScale,2e-6)){hit=true;tr=trap;break;}
    t+=d*k; st+=1.0;
    if(t>uFar) break;
  }
  if(!hit&&t<uFar){hit=true;tr=trap;}
  vec3 bg=sky(rd);
  vec3 col=bg;
  if(hit){
    vec3 p=uPos+rd*t;
    float e=max(px*t*0.6,max(2e-5*uScale,2e-6));
    vec3 n=nrm(p,e);
    float h=max(px*t*5.0,0.012*uScale);
    float ao=0.0;
    for(int i=1;i<=3;i++){float hh=h*float(i); ao+=clamp(de(p+n*hh)/hh,0.0,1.0);}
    ao=0.25+0.75*ao/3.0;
    ao*=1.0-0.45*st/170.0;
    vec3 base;
    if(uWorld==0){
      base=pal(tr/6.0+0.05,vec3(0.56,0.50,0.48),vec3(0.36,0.30,0.30),vec3(1.0),vec3(0.02,0.12,0.26));
    }else if(uWorld==1){
      base=pal(sqrt(tr)*0.9,vec3(0.55,0.56,0.55),vec3(0.40,0.36,0.34),vec3(1.0,0.9,0.8),vec3(0.55,0.42,0.30));
    }else if(uWorld==2){
      base=pal(tr*1.3,vec3(0.50,0.42,0.52),vec3(0.45,0.40,0.42),vec3(1.0,1.0,0.8),vec3(0.80,0.95,0.15));
    }else if(uWorld==3){
      float w=smoothstep(0.15,0.95,sqrt(tr));
      base=mix(vec3(0.10,0.20,0.78),vec3(0.80,0.88,0.86),w);
      base=mix(base,vec3(0.16,0.42,0.30),0.35*smoothstep(0.0,0.12,0.12-sqrt(tr)));
    }else if(uWorld==4){
      vec3 rb=0.5+0.5*cos(6.28318*(tr*5.0+vec3(0.0,0.33,0.67)));
      float band=smoothstep(0.30,0.55,abs(fract(tr*2.5)-0.5)*2.0);
      base=mix(vec3(0.05,0.09,0.22),rb*1.25,band);
    }else if(uWorld==5){
      base=pal(tr/6.0,vec3(0.74,0.86,0.94),vec3(0.20,0.14,0.08),vec3(1.0),vec3(0.55,0.60,0.70));
    }else if(uWorld==6){
      base=mix(vec3(0.88,0.82,0.68),vec3(0.70,0.30,0.12),smoothstep(0.15,1.0,sqrt(tr)));
    }else if(uWorld==7){
      base=pal(sqrt(tr)*0.33,vec3(0.56,0.42,0.50),vec3(0.44,0.40,0.40),vec3(1.0,0.8,0.9),vec3(0.92,0.20,0.55));
    }else if(uWorld==8){
      base=pal(sqrt(tr)*0.22,vec3(0.78,0.62,0.44),vec3(0.18,0.16,0.14),vec3(1.0),vec3(0.05,0.10,0.20));
    }else if(uWorld==9){
      base=pal(sqrt(tr)*0.45,vec3(0.72,0.74,0.76),vec3(0.26,0.22,0.24),vec3(1.0,1.0,1.0),vec3(0.95,0.30,0.60));
    }else if(uWorld==10){
      base=pal(sqrt(tr)*0.30,vec3(0.62,0.44,0.46),vec3(0.38,0.34,0.30),vec3(1.0,0.9,0.7),vec3(0.88,0.12,0.40));
    }else{
      base=mix(vec3(0.34,0.31,0.29),vec3(0.62,0.52,0.42),smoothstep(0.2,1.6,sqrt(tr)));
    }
    vec3 L=normalize(vec3(0.45,0.75,0.35));
    float dif=clamp(dot(n,L),0.0,1.0);
    float up=0.5+0.5*n.y;
    float head=clamp(dot(n,-rd),0.0,1.0)/(1.0+t*t*4.0/(uFar*uFar)*9.0);
    vec3 lit=base*(sky(vec3(0.0,1.0,0.0))*0.55*up+vec3(1.0,0.9,0.78)*dif*0.85+vec3(0.9,0.85,0.8)*head*0.55+0.08);
    col=lit*ao;
    if(uWorld==4) col=col*0.75+base*0.22*ao;
    float f=1.0-exp(-pow(t/uFar*2.3,1.8));
    col=mix(col,sky(vec3(rd.x,0.02,rd.z)),f);
  }
  if(uWorld>=3){
    float g=st/170.0;

// With gravity on, the view is pulled back level: no roll, the head above the feet,
// and up/down limited to just short of straight up or down.
function levelTarget(){
  let hx=camF[0],hz=camF[2];
  if(Math.hypot(hx,hz)<0.05){const sg=camF[1]<0?1:-1;hx=camU[0]*sg;hz=camU[2]*sg;}
  if(camU[1]<0){hx=-hx;hz=-hz;}          // upside down: face the way the head points
  const yw=Math.atan2(hx,-hz);
  let pt=Math.asin(Math.max(-1,Math.min(1,camF[1])));
  if(camU[1]<0)pt=(pt>0?1:-1)*Math.PI-pt;   // over the top: mirror back
  pt=Math.max(-1.45,Math.min(1.45,pt));
  const sy=Math.sin(yw),cy=Math.cos(yw),sp=Math.sin(pt),cp=Math.cos(pt);
  const F=[sy*cp,sp,-cy*cp],R=[cy,0,sy];return [F,cr3(R,F)];
}
function levelView(dt){
  const [F,U]=levelTarget(),k=1-Math.exp(-dt*7);
  let f=[0,1,2].map(i=>camF[i]+(F[i]-camF[i])*k),u=[0,1,2].map(i=>camU[i]+(U[i]-camU[i])*k);
  const fl=Math.hypot(f[0],f[1],f[2]);if(fl<1e-6)return;f=f.map(v=>v/fl);
  let r=cr3(f,u);const rl=Math.hypot(r[0],r[1],r[2]);if(rl<1e-6)return;
  camF=f;camR=r.map(v=>v/rl);camU=cr3(camR,camF);
}
function turn(a,b){
  a*=OPT.sens;b*=OPT.sens;
  if(limitOn()){
    // walking: turn about the world's up axis, look up/down about the level right axis
    const [F]=levelTarget();
    let yw=Math.atan2(F[0],-F[2])+a,pt=Math.asin(Math.max(-1,Math.min(1,F[1])))+b;
    pt=Math.max(-1.45,Math.min(1.45,pt));
    const aligned=Math.abs(camR[1])<0.02&&camU[1]>0;
    const sy=Math.sin(yw),cy=Math.cos(yw),sp=Math.sin(pt),cp=Math.cos(pt);
    const nF=[sy*cp,sp,-cy*cp],nR=[cy,0,sy];
    if(aligned){camF=nF;camR=nR;camU=cr3(nR,nF);return;}
  }
  const ca=Math.cos(a),sa=Math.sin(a);let f=[0,1,2].map(i=>camF[i]*ca+camR[i]*sa);
  const cb=Math.cos(b),sb=Math.sin(b);const u=[0,1,2].map(i=>camU[i]*cb-f[i]*sb);f=[0,1,2].map(i=>f[i]*cb+camU[i]*sb);
  const l=Math.hypot(f[0],f[1],f[2]);camF=f.map(v=>v/l);
  let r=cr3(camF,u);const rl=Math.hypot(r[0],r[1],r[2]);camR=r.map(v=>v/rl);camU=cr3(camR,camF);
}

function fits(p,r){

  document.querySelectorAll('input[name=sLook]').forEach(r=>r.checked=r.value===OPT.look);
}
[['sGrav','grav'],['sJump','jump'],['sFall','fall'],['sSens','sens']].forEach(([id,k])=>
  $(id).addEventListener('input',e=>{OPT[k]=+e.target.value;syncOpt();saveOpt();}));
$('sEdge').addEventListener('change',e=>{OPT.edge=e.target.checked;saveOpt();});
document.querySelectorAll('input[name=sLook]').forEach(r=>r.addEventListener('change',()=>{OPT.look=r.value;saveOpt();}));
tap('sReset',()=>{OPT=Object.assign({},DEF);syncOpt();saveOpt();});
syncOpt();
const touch=matchMedia('(hover:none)').matches;
$('hint').innerHTML=touch
  ?'左下のスティックで移動、画面をドラッグで見回す。<br>体の大きさは自動で変わります。壁へ向かって進むと、縮みながら奥へ入っていけます。'
  :'マウスを動かすと見回す（クリックでカーソル固定、Escで解除）<br>WASD 移動 ・ Space ジャンプ/上昇<br>F 飛行 ・ G 自動サイズ ・ O 設定 ・ Q/E 縮む/育つ ・ 1〜9 ワールド<br>壁へ向かって進むと、縮みながら奥へ入っていけます';

// ---------- physics ----------
function collide(){
  const r=R0*size;grounded=false;
  for(let k=0;k<4;k++){
    const d=W.de(pos[0],pos[1],pos[2]);
    if(d>=r)break;
    const n=grad(pos),push=r-d;
    pos[0]+=n[0]*push;pos[1]+=n[1]*push;pos[2]+=n[2]*push;
    if(n[1]>0.55){grounded=true;if(vy<0)vy=0;}
    if(n[1]<-0.55&&vy>0)vy=0;
  }
}
function step(dt){
  if(limitOn())levelView(dt);
  if(OPT.edge&&!locked()&&mIn&&(mEdge[0]||mEdge[1]))turn(mEdge[0]*1.6*dt/OPT.sens,mEdge[1]*1.6*dt/OPT.sens);
  let ix=mx,iz=mz;
  if(keys.KeyW||keys.ArrowUp)iz+=1;if(keys.KeyS||keys.ArrowDown)iz-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;
  const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  if(il>0.2&&!moved){moved=true;setTimeout(()=>$('hint').style.opacity=0,2500);}
  const jump=jumpHeld||keys.Space;
  let vx,vz,vyy;
  if(fly){
    const v=1.5*size*(keys.ShiftLeft?2.2:1),j=jump?0.8:0;
    vx=(camR[0]*ix+camF[0]*iz+camU[0]*j)*v;vyy=(camR[1]*ix+camF[1]*iz+camU[1]*j)*v;vz=(camR[2]*ix+camF[2]*iz+camU[2]*j)*v;vy=0;
  }else{
    const v=0.9*size*(keys.ShiftLeft?1.8:1);
    // walking: forward is the view direction flattened onto the ground
    let hx=camF[0],hz=camF[2];
    if(Math.hypot(hx,hz)<0.15){const sg=camF[1]<0?1:-1;hx=camU[0]*sg;hz=camU[2]*sg;}
    const hl=Math.hypot(hx,hz)||1;hx/=hl;hz/=hl;
    vx=(-hz*ix+hx*iz)*v;vz=(hx*ix+hz*iz)*v;
    const gv=3.2*OPT.grav;
    if(grounded&&jump)vy=1.5*size*Math.sqrt(OPT.grav*OPT.jump);
    vy=Math.max(vy-gv*size*dt,-3.6*size*Math.sqrt(OPT.grav));vyy=vy;
  }
  const dist=Math.hypot(vx,vyy,vz)*dt,n=Math.min(8,Math.max(1,Math.ceil(dist/(0.4*R0*size))));
  let g=false;
  for(let i=0;i<n;i++){
    pos[0]+=vx*dt/n;pos[1]+=vyy*dt/n;pos[2]+=vz*dt/n;collide();g=g||grounded;
  }
  grounded=g;
  if(!fly&&!grounded&&vy<0){fallT+=dt;if(OPT.fall>0&&fallT>OPT.fall){setFly(true);toast('落ち続けたので飛行に切り替えました');}}
  else fallT=0;
  W.fold(pos);
  if(auto&&fly){
    const d=W.de(0,0,0);
    const u=Math.max(-1,Math.min(1,Math.log(Math.max(d,1e-9)/W.dT)));
    if(Math.abs(u)>0.06){
      const dk=autoScale(Math.exp(u*2.4*dt));
      if(dk){kexp+=dk;$('sz').innerHTML=label(kexp);}
    }
  }
}

// ---------- loop ----------
let last=performance.now(),acc=0,frames=0;
const fA=new Float32Array(24),fS=new Float32Array(8).fill(1),fT=new Float32Array(8);
function frame(now){
  const raw=now-last;last=now;
  const dt=Math.min(raw,50)/1000;
  step(dt);
  acc+=raw;frames++;
  if(frames>=24){
    if(!W.menger){const k=eK(kexp);if(k!==kexp){kexp=k;$('sz').innerHTML=label(kexp);}}
    const avg=acc/frames;acc=0;frames=0;
    if(avg>26&&quality>0.25)quality=Math.max(0.25,quality*0.85);
    else if(avg<15&&quality<1)quality=Math.min(1,quality*1.08);
  }
  resize();
  const f=camF,r=camR,u=camU;
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform3f(U.uPos,pos[0],pos[1],pos[2]);
  gl.uniformMatrix3fv(U.uRot,false,[r[0],r[1],r[2],u[0],u[1],u[2],-f[0],-f[1],-f[2]]);
  gl.uniform1i(U.uWorld,world);gl.uniform1i(U.uKind,W.gk);gl.uniform1i(U.uRule,W.rule||0);
  gl.uniform1f(U.uScale,size);
  gl.uniform1f(U.uFar,W.far);
  gl.uniform1i(U.uIter,iters);
  if(!W.menger){
    const G=E.G,H=E.G0;
    gl.uniform3f(U.uP,E.p[0],E.p[1],E.p[2]);gl.uniform3f(U.uC,E.c0[0],E.c0[1],E.c0[2]);
    gl.uniformMatrix3fv(U.uG,false,[G[0],G[3],G[6],G[1],G[4],G[7],G[2],G[5],G[8]]);
    gl.uniformMatrix3fv(U.uG0,false,[H[0],H[3],H[6],H[1],H[4],H[7],H[2],H[5],H[8]]);
    gl.uniform1f(U.uInvS,E.invS);gl.uniform1i(U.uTile,E.stack.length===0?1:0);gl.uniform1f(U.uDr0,E.dr0);gl.uniform1f(U.uCr,E.cr);
    gl.uniform1f(U.uBS,W.S||1);gl.uniform1f(U.uTileP,W.tile||1);
    if(W.kr){const K=W.kr;gl.uniformMatrix3fv(U.uKR,false,[K[0],K[3],K[6],K[1],K[4],K[7],K[2],K[5],K[8]]);gl.uniform1f(U.uKS,W.ks);gl.uniform3f(U.uKO,W.ko[0],W.ko[1],W.ko[2]);}
    if(W.delta){
      eRef();
      gl.uniform3fv(U['uR[0]'],REF.R);gl.uniform3fv(U['uH[0]'],REF.H);gl.uniform3fv(U['uL[0]'],REF.L);
      gl.uniform3fv(U['uSg[0]'],REF.Sg);gl.uniform1fv(U['uMs[0]'],REF.Ms);
      gl.uniform3f(U.uAf,REF.A[0],REF.A[1],REF.A[2]);gl.uniform1f(U.uMc,REF.Mc);
    }
  }
  if(W.menger){
    for(let i=0;i<8;i++){const L=act[i];
      if(L){fA[i*3]=L.a[0];fA[i*3+1]=L.a[1];fA[i*3+2]=L.a[2];fS[i]=L.s;fT[i]=L.t;}}
    gl.uniform1i(U.uN,act.length);
    gl.uniform3fv(U['uA[0]'],fA);gl.uniform1fv(U['uS[0]'],fS);gl.uniform1fv(U['uT[0]'],fT);
  }
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
setWorld(0);resize();requestAnimationFrame(frame);
}
</script>
